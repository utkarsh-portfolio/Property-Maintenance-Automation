# Render Blueprint for free deployment
# Deploy at: https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: property-maintenance-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: property-maintenance-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # Frontend
  - type: web
    name: property-maintenance-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    rootDir: frontend
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: property-maintenance-api
          property: url

databases:
  - name: property-maintenance-db
    plan: free
    region: oregon
